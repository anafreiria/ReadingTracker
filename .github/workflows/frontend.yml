name: Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check frontend and run automated tests
        env:
          FRONTEND_REPORT_DIR: ${{ runner.temp }}/frontend-checks
        run: node scripts/check-frontend.mjs
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-checks
          if-no-files-found: warn
          retention-days: 7
