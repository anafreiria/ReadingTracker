<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#234c40">
  <title>Reading Tracker</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#readings"><span class="brand-mark" aria-hidden="true">RT</span> Reading Tracker</a>
    <nav aria-label="Main navigation">
      <a href="#readings" data-route="readings">Reading History</a>
      <a href="#books" data-route="books">Books</a>
      <a href="#authors" data-route="authors">Authors</a>
    </nav>
    <span class="header-caption">Your personal library</span>
  </header>
  <main id="main" tabindex="-1">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow" id="page-eyebrow"></p>
      <div class="title-row"><div><h1 id="page-title"></h1><p id="page-description" class="description"></p></div><button id="preview-button" type="button" disabled></button></div>
    </section>
    <div id="announcement" role="status" aria-live="polite" tabindex="-1"></div>
    <div id="content" aria-busy="true"></div>
    <noscript><p>Please enable JavaScript to open your library.</p></noscript>
  </main>
  <footer><span>Reading Tracker</span><span>One book. Many reading journeys.</span><button id="reset-data" type="button" class="button-link" disabled></button></footer>
  <dialog id="form-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="button-secondary" id="close-dialog">Close</button></div><div id="dialog-content"></div></dialog>
</body>
</html>
