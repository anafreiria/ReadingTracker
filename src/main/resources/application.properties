spring.application.name=readingtracker

# Persistence: H2 stored in a file so data survives restarts (assignment Section 7).
# The ./data folder is created next to pom.xml and is ignored by Git.
spring.datasource.url=jdbc:h2:file:./data/readingtracker
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Services map entities to DTOs inside their own transactions.
spring.jpa.open-in-view=false
# Loads lazy associations (book authors/themes, author country) in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Pass LocalDate straight to JDBC. Converting through java.sql.Date shifted historical dates by one
# day (America/Sao_Paulo used local mean time, -03:06:28, before 1914): 1821-11-11 became 1821-11-10.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true

# H2 console (optional, Section 11): http://localhost:8080/h2-console
spring.h2.console.enabled=true
